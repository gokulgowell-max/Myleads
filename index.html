function bulk(){
 if(!sel.size)return toast('Select leads first');
 const t=[...document.querySelectorAll('#btd input:checked')].map(c=>c.value);
 if(!t.length)return toast('Choose who to assign to');
 const ids=[...sel];
 if(t.length===1){
  google.script.run.withSuccessHandler(n=>{toast(n+' lead(s) moved');sel.clear();load()}).withFailureHandler(fail).assign(K,ids,t[0]==='_un'?'':t[0]);return
 }
 // several recruiters: leads are shared equally, one by one (round robin)
 const g=t.map(()=>[]);ids.forEach((id,i)=>g[i%t.length].push(id));
 let moved=0;toast('Moving leads…');
 const run=i=>{
  if(i>=t.length){toast(moved+' lead(s) shared among '+t.length+' recruiters');sel.clear();load();return}
  if(!g[i].length)return run(i+1);
  google.script.run.withSuccessHandler(n=>{moved+=n;run(i+1)}).withFailureHandler(e=>{if(moved){sel.clear();load()}fail(e)}).assign(K,g[i],t[i])
 };
 run(0)
}

 <div class="f"><label>Project (active projects only)</label><select id="pj" onchange="pjChg()"><option value="">Select project</option>${(D.projects||[]).filter(p=>p.active).map(p=>`<option>${esc(p.name)}</option>`).join('')}</select>${(D.projects||[]).some(p=>p.active)?'':'<small style="color:var(--mute)">No active project. Create one in the Projects tab first.</small>'}</div>
 <div class="f"><label>Lead source (based on the project)</label><select id="ls" disabled onchange="srcChg()"><option value="">Select a project first</option></select><input id="lsn" style="display:none;margin-top:6px" maxlength="80" autocomplete="off" placeholder="Type the new source name"><div style="font-size:12px;color:var(--mute);margin-top:4px">Applies to every lead below, unless a line has its own source in the Lead source column.</div></div>
 <div class="f"><label>Leads: paste from the template (Name, Number, Email, Category, Lead source)</label><div style="font-size:12px;color:var(--mute);margin-bottom:6px">Only the Number is required. Name can be blank or anything. Lead source is visible to admins only.</div><button class="ghost" style="color:var(--pri);margin-bottom:8px" onclick="leadTemplate()">Download template (CSV)</button><textarea id="t" placeholder="Name, Number, Email, Category, Lead source"></textarea></div>
 <div class="f"><label>Recruiters (leads are shared equally, round robin)</label><div id="rc">${D.team.map(t=>`<label style="display:block;color:var(--ink);font-size:15px"><input type="checkbox" value="${esc(t.email)}" style="width:auto"> ${esc(t.name)}</label>`).join('')}</div>
 <button class="ghost" style="color:var(--pri);margin-top:6px" onclick="document.querySelectorAll('#rc input').forEach(c=>c.checked=true)">Select all</button></div>
 <div class="row"><button id="ab" onclick="add()">Distribute leads</button></div></div>`
}
/* Lead sources already used in a project (manual recruiter entries are left out) */
const projSources=pn=>[...new Set((D.leads||[]).filter(l=>l.Project==pn&&l.Source&&!/^Manual/.test(l.Source)).map(l=>l.Source))].sort((a,b)=>a.localeCompare(b));
function pjChg(){
 const pn=$('pj').value,ls=$('ls'),nw=$('lsn');nw.style.display='none';nw.value='';
 if(!pn){ls.disabled=true;ls.innerHTML='<option value="">Select a project first</option>';return}
 ls.disabled=false;
 ls.innerHTML='<option value="">No source</option>'+projSources(pn).map(x=>`<option>${esc(x)}</option>`).join('')+'<option value="__new">+ Add new source</option>'
}
function srcChg(){const n=$('lsn'),on=$('ls').value==='__new';n.style.display=on?'':'none';if(on)n.focus();else n.value=''}
function add(){
 const t=$('t').value.trim(),p=$('pj').value.trim(),e=[...document.querySelectorAll('#rc input:checked')].map(c=>c.value);
 if(!p)return toast('Enter a project name');if(!t)return toast('Paste some leads first');if(!e.length)return toast('Select at least one recruiter');
 let src=$('ls').value;if(src==='__new'){src=$('lsn').value.trim();if(!src)return toast('Type the new source name')}
 $('ab').disabled=true;
 google.script.run.withSuccessHandler(r=>{$('ab').disabled=false;F.proj=p;tab='leads';showReport(r);load()}).withFailureHandler(e2=>{$('ab').disabled=false;fail(e2)}).addLeads(K,t,e,p,src)
}
function showReport(r){
 const rows=r.report||[],cls={added:'ok',duplicate:'w',short:'b'},lbl={added:'Added',duplicate:'Duplicate',short:'Less than 10 digits'};
 window._rep=rows;
 $('bx').style.maxWidth='920px';
 $('bx').innerHTML=`<h3 class="nm" style="font-size:22px">Distribution report</h3>
 <div class="kpis"><div class="kpi"><b>${r.added+(r.dup||0)+(r.short||0)}</b><small>Total lines</small></div><div class="kpi"><b>${r.added}</b><small>Added</small></div><div class="kpi"><b>${r.dup||0}</b><small>Duplicate</small></div><div class="kpi"><b>${r.short||0}</b><small>Less than 10 digits</small></div></div>
 <div style="max-height:55vh;overflow:auto;border:1px solid var(--line);border-radius:10px"><table style="min-width:0"><tr><th>Line</th><th>Name</th><th>Number</th><th>Result</th><th style="text-align:left">Detail</th></tr>${rows.map(x=>`<tr><td>${x.line}</td><td>${esc(x.name)}</td><td>${esc(x.phone)}</td><td><span class="tag ${cls[x.result]}">${lbl[x.result]}</span></td><td style="white-space:normal;text-align:left">${esc(x.detail)}</td></tr>`).join('')||'<tr><td colspan="5">Nothing to report</td></tr>'}</table></div>
 <div class="row"><button class="ghost" onclick="dlReport()">Download report (CSV)</button><button onclick="closeP()">Close</button></div>`;
 $('md').classList.add('on')
}
function dlReport(){
 const rows=window._rep||[],q=v=>'"'+String(v==null?'':v).replace(/"/g,'""')+'"';
 const csv=['Line,Name,Number,Result,Detail'].concat(rows.map(x=>[x.line,x.name,x.phone,x.result,x.detail].map(q).join(','))).join('\n');
 const a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['\ufeff'+csv],{type:'text/csv'}));a.download='distribution-report-'+today()+'.csv';a.click()
}
function loginScreen(msg){
 $('who').textContent='';$('nav').innerHTML='';$('so').style.display='none';
 document.body.style.background='#eef5f3';
 $('main').innerHTML=`<div style="max-width:390px;margin:44px auto;background:#fff;border-radius:22px;box-shadow:0 24px 60px #0a3d3440;overflow:hidden">
  <div style="background:linear-gradient(135deg,#0d6b5c,#084a40);color:#fff;padding:28px 24px 26px;text-align:center">
   <div style="width:68px;height:68px;margin:0 auto 12px;border-radius:18px;background:#e8a33d;display:flex;align-items:center;justify-content:center;font-size:32px;font-weight:800;color:#084a40;box-shadow:0 8px 20px #0003">G</div>
   <div style="font-size:21px;font-weight:700;letter-spacing:.2px">Gowell Call Tracker</div>
   <div style="opacity:.85;font-size:13px;margin-top:6px">${esc(msg||'Welcome. Sign in with your name and PIN.')}</div>
  </div>
  <div style="padding:24px 26px 26px">
   <label style="font-size:12px;font-weight:700;color:#44546a;letter-spacing:.3px">YOUR NAME</label>
   <select id="ln" style="width:100%;margin:6px 0 20px;padding:13px 12px;border:1.5px solid #c9d8d4;border-radius:12px;font:inherit;font-size:15px;background:#fff"><option value="">Loading names…</option></select>
   <label style="font-size:12px;font-weight:700;color:#44546a;letter-spacing:.3px">4-DIGIT PIN</label>
   <div id="pinrow" style="display:flex;gap:12px;justify-content:center;margin:10px 0 24px">${[0,1,2,3].map(i=>`<input class="pin" data-i="${i}" type="password" inputmode="numeric" maxlength="1" autocomplete="one-time-code" style="width:58px;height:66px;text-align:center;font-size:28px;font-weight:700;border:2px solid #c9d8d4;border-radius:14px;outline:none;background:#f8fbfa;color:#084a40;text-transform:none">`).join('')}</div>
   <button id="lb2" onclick="pwLogin()" style="width:100%;padding:15px;border:0;border-radius:14px;background:linear-gradient(135deg,#0d6b5c,#084a40);color:#fff;font-size:16px;font-weight:700;cursor:pointer;box-shadow:0 10px 24px #0d6b5c44">Sign in</button>
   <p style="text-align:center;font-size:12px;color:#6b7a8c;margin:16px 0 0">This browser stays signed in for 30 days.</p>
  </div></div>`;
 pinBind();
 google.script.run.withSuccessHandler(a=>{const s=$('ln');if(s)s.innerHTML='<option value="">Select your name</option>'+a.map(n=>`<option>${esc(n)}</option>`).join('')}).withFailureHandler(()=>{const s=$('ln');if(s)s.innerHTML='<option value="">Could not load names</option>'}).loginList()
}
function pinBind(){
 const pins=[...document.querySelectorAll('.pin')];
 pins.forEach(el=>{
  el.addEventListener('focus',()=>el.select());
  el.addEventListener('input',()=>{el.value=el.value.replace(/\D/g,'').slice(0,1);if(el.value){const n=pins[+el.dataset.i+1];n?n.focus():$('lb2').focus()}});
  el.addEventListener('keydown',e=>{if(e.key==='Backspace'&&!el.value){const p=pins[+el.dataset.i-1];if(p){p.value='';p.focus()}}if(e.key==='Enter')pwLogin()});
  el.addEventListener('paste',e=>{e.preventDefault();const t=(e.clipboardData||window.clipboardData).getData('text').replace(/\D/g,'').slice(0,4);[...t].forEach((ch,i)=>{if(pins[i])pins[i].value=ch});const f=pins[Math.min(t.length,3)];if(f)f.focus()});
 });
 if(pins[0])pins[0].focus()
}
function pwLogin(){
 const n=$('ln').value,p=[...document.querySelectorAll('.pin')].map(x=>x.value).join('');
 if(!n)return toast('Choose your name');
 if(!/^\d{4}$/.test(p))return toast('Enter your 4-digit PIN');
 $('lb2').disabled=true;
 google.script.run.withSuccessHandler(t=>{ST.set(t);K=t;document.body.style.background='';load()}).withFailureHandler(e=>{$('lb2').disabled=false;fail(e);document.querySelectorAll('.pin').forEach(x=>x.value='');const f=document.querySelector('.pin');if(f)f.focus()}).loginPassword(n,p)
}
let SCORE=null;
function scoreFill(){
 if(!isM())return;
 $('dc').innerHTML=`<div class="fp">${dbar(false)}<div class="fr"><select id="se" onchange="F.se=this.value;scoreFill()"><option value="">All employees</option>${D.members.map(t=>`<option value="${esc(t.email)}" ${F.se==t.email?'selected':''}>${esc(t.name)}</option>`).join('')}</select><select id="sp" onchange="F.sp=this.value;scoreFill()"><option value="">All projects</option>${(D.projects||[]).map(p=>`<option ${F.sp==p.name?'selected':''}>${esc(p.name)}</option>`).join('')}</select><button onclick="scoreXls()">Export Excel</button></div></div><div id="scbody"><div class="empty">Loading…</div></div>`;
 google.script.run.withSuccessHandler(r=>{SCORE=r;$('scbody').innerHTML=scoreHTML(r)+sourceHTML()}).withFailureHandler(fail).getScoreboard(K,F.lf||'0000-00-00',F.lt||'9999-12-31',F.se||'',F.sp||'')
}
const srcSel=()=>`<select onchange="F.src=this.value;fillLeads()"><option value="">All sources</option>${[...new Set(D.leads.map(l=>l.Source).filter(Boolean))].sort().map(s=>`<option ${F.src==s?'selected':''}>${esc(s)}</option>`).join('')}</select>`;
function leadTemplate(){const csv='Name,Number,Email,Category,Lead source\n'+'Anu Thomas,9876543210,anu@example.com,Nurse,Facebook\n'+',9123456780,,Doctor,Walk-in\n';const a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['\ufeff'+csv],{type:'text/csv'}));a.download='lead-template.csv';a.click()}
function sourceHTML(){const P=F.sp||'';const L=D.leads.filter(l=>!P||l.Project==P);const g={};L.forEach(l=>{const s=l.Source||'(no source)';const b=g[s]=g[s]||{n:0,c:0,i:0,s:0};b.n++;if(l.Status=='Call Connected'||l.CandidateStatus)b.c++;if(l.CandidateStatus=='Interested')b.i++;if(l.CandidateStatus=='Submitted')b.s++});
 const rows=Object.entries(g).sort((a,b)=>b[1].n-a[1].n),pc=(x,n)=>n?Math.round(x/n*100)+'%':'-';
 return `<h3>Lead source quality${P?' · '+esc(P):''}</h3><p style="color:var(--mute);font-size:13px;margin:0 0 8px">Connected means the lead is connected now or has a candidate status.</p><div class="tw"><table><tr><th>Source</th><th>Leads</th><th>Connected</th><th>Connect %</th><th>Interested</th><th>Interested %</th><th>Submitted</th><th>Submitted %</th></tr>${rows.map(([s,b])=>`<tr><td><b>${esc(s)}</b></td><td>${b.n}</td><td>${b.c}</td><td>${pc(b.c,b.n)}</td><td>${b.i}</td><td>${pc(b.i,b.n)}</td><td>${b.s}</td><td>${pc(b.s,b.n)}</td></tr>`).join('')||'<tr><td colspan="8">No leads</td></tr>'}</table></div>`}
function scoreHTML(r){
 const neg=v=>`<span style="color:${v<0?'#a8321f':'inherit'};font-weight:700">${v}</span>`;
 const T=r.rows.reduce((a,x)=>a+x.Total,0);
 return `<div class="kpis"><div class="kpi"><b>${r.rows.length}</b><small>People with points</small></div><div class="kpi"><b>${T}</b><small>Team total</small></div></div>
 <div class="tw"><table><tr><th>Employee</th><th>Attempt (+5)</th><th>Connected (+10)</th><th>Profile (+20)</th><th>Submitted (+30)</th><th>Passed on (−5)</th><th>No attempt (−10)</th><th>Total</th></tr>${r.rows.map(x=>`<tr><td><b>${esc(x.name)}</b></td><td>${x.Attempt}</td><td>${x.Connected}</td><td>${x.Profile}</td><td>${x.Submitted}</td><td>${x.Passed}</td><td>${x.NoAttempt}</td><td>${neg(x.Total)}</td></tr>`).join('')||'<tr><td colspan="8">No points in this range</td></tr>'}</table></div>
 <h3>Points ledger</h3><div class="tw"><table><tr><th>Date</th><th>Employee</th><th>Lead</th><th>Project</th><th>Event</th><th>Points</th><th>Note</th></tr>${r.ledger.slice(0,300).map(e=>`<tr><td>${esc(e.date)}</td><td>${esc(e.name)}</td><td>${esc(e.leadId)}</td><td>${esc(e.project)}</td><td>${esc(e.event)}</td><td>${neg(e.points)}</td><td style="white-space:normal;text-align:left">${esc(e.note)}</td></tr>`).join('')||'<tr><td colspan="7">No entries</td></tr>'}</table></div>`
}
function scoreXls(){
 const R=(SCORE&&SCORE.rows)||[],L=(SCORE&&SCORE.ledger)||[];if(!R.length&&!L.length)return toast('Nothing to export');
 const x=s=>String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
 const cell=v=>`<Cell><Data ss:Type="${typeof v==='number'?'Number':'String'}">${x(v)}</Data></Cell>`;
 const sheet=(name,hdr,rows)=>`<Worksheet ss:Name="${name}"><Table><Row>${hdr.map(cell).join('')}</Row>${rows.map(r=>'<Row>'+r.map(cell).join('')+'</Row>').join('')}</Table></Worksheet>`;
 const s1=sheet('Scoreboard',['Employee','Attempt','Connected','Profile','Submitted','Passed on','No attempt','Total'],R.map(r=>[r.name,r.Attempt,r.Connected,r.Profile,r.Submitted,r.Passed,r.NoAttempt,r.Total]));
 const s2=sheet('Ledger',['Date','Employee','Lead','Project','Event','Points','Note'],L.map(e=>[e.date,e.name,e.leadId,e.project,e.event,e.points,e.note]));
 const xml=`${'<'+'?'}xml version="1.0"?>${'<'+'?'}mso-application progid="Excel.Sheet"?><Workbook xmlns="urn:schemas-microsoft-com:office:spreadsheet" xmlns:ss="urn:schemas-microsoft-com:office:spreadsheet">${s1}${s2}</Workbook>`;
 const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([xml],{type:'application/vnd.ms-excel'}));a.download='scoreboard-'+today()+'.xls';a.click()
}
function isWorkC(ds,em){const rows=(D.calendar||[]).filter(x=>x.date===ds&&(!x.email||x.email===em));if(rows.some(x=>x.kind==='LEAVE'))return false;if(rows.some(x=>x.kind==='WORK'))return true;return new Date(ds+'T12:00:00').getDay()!==0}
function calFill(){
 if(!isM())return;
 const ym=F.cm||today().slice(0,7),[y,m]=ym.split('-').map(Number),days=new Date(y,m,0).getDate(),ex=D.calendar||[];
 let cells='';for(let i=0;i<new Date(y,m-1,1).getDay();i++)cells+='<div></div>';
 for(let d=1;d<=days;d++){const ds=`${y}-${String(m).padStart(2,'0')}-${String(d).padStart(2,'0')}`,rows=ex.filter(x=>x.date===ds),work=isWorkC(ds,''),note=rows.map(x=>(x.kind=='WORK'?'Working':'Leave')+(x.email?' ('+esc(x.email)+')':' (team)')).join('<br>');
  cells+=`<div onclick="calEdit('${ds}')" style="border:1px solid #d9e1ec;border-radius:10px;padding:8px;min-height:72px;cursor:pointer;background:${work?'#fff':'#fbeaea'}"><b>${d}</b><div style="font-size:12px;color:${work?'#0d6b5c':'#a8321f'}">${work?'Working':'Leave'}</div><div style="font-size:11px;color:#6b7a8c">${note}</div></div>`}
 $('dc').innerHTML=`<div class="fp"><div class="fr"><button onclick="calMove(-1)">‹ Prev</button><b>${ym}</b><button onclick="calMove(1)">Next ›</button></div></div><div style="display:grid;grid-template-columns:repeat(7,1fr);gap:8px;margin-top:10px">${['Sun','Mon','Tue','Wed','Thu','Fri','Sat'].map(x=>`<div style="text-align:center;font-weight:700;color:#5d6f69">${x}</div>`).join('')}${cells}</div><p style="color:#5d6f69;font-size:13px">Sundays are leave days unless marked as working. Click a day to change it.</p>`
}
function calMove(n){const [y,m]=(F.cm||today().slice(0,7)).split('-').map(Number);const d=new Date(y,m-1+n,1);F.cm=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');calFill()}
function calEdit(ds){const sun=new Date(ds+'T12:00:00').getDay()===0;
 $('bx').innerHTML=`<h3 class="nm" style="font-size:20px">${ds}</h3><div class="f">${sun?`<button onclick="calSet('${ds}','WORK','')">Working day (whole team)</button> `:''}<button class="ghost" onclick="calSet('${ds}','LEAVE','')">Leave (whole team)</button></div><div class="f"><label>One person</label><select id="ce">${D.members.map(t=>`<option value="${esc(t.email)}">${esc(t.name)}</option>`).join('')}</select> <button class="ghost" onclick="calSet('${ds}','LEAVE',$('ce').value)">Leave</button>${sun?` <button class="ghost" onclick="calSet('${ds}','WORK',$('ce').value)">Working day</button>`:''}</div><div class="f"><button class="ghost" style="color:var(--mute)" onclick="calSet('${ds}','CLEAR','')">Clear team note for this day</button></div><div class="row"><button class="ghost" onclick="closeP()">Close</button></div>`;$('md').classList.add('on')}
function calSet(ds,kind,em){google.script.run.withSuccessHandler(()=>{toast('Calendar saved');closeP();load()}).withFailureHandler(fail).setCalendarDay(K,ds,kind,em,'')}
function signOut(){ST.set('');K='';D=null;loginScreen()}
addEventListener('resize',()=>{const t=$('top');if(t)document.documentElement.style.setProperty('--th',t.offsetHeight+'px')});
let _lr=Date.now();
setInterval(()=>{const gap=(isM()&&tab=='dash')?15000:180000;if(!document.hidden&&K&&D&&!$('md').classList.contains('on')&&!window._saving&&Date.now()-_lr>=gap-1000){_lr=Date.now();refreshSilent()}},5000);
load();
</script></body></html>
